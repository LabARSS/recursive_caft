[project]
name = "complexity-aware-fine-tuning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "accelerate==1.3.0",
    "datasets>=3.6.0",
    "ipywidgets>=8.1.7",
    "loguru>=0.7.3",
    "matplotlib>=3.10.1",
    "mistralai>=1.6.0",
    "numpy>=2.2.4",
    "openai>=1.78.1",
    "pandas>=2.2.3",
    "peft>=0.17.1",
    "protobuf>=6.30.2",
    "pyarrow>=19.0.1",
    "pydraconf>=0.1.0",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.1",
    "torch>=2.6.0",
    "transformers>=4.52.3",
    "vllm",
]

[tool.uv]
environments = [
    "platform_machine == 'arm64' and sys_platform == 'darwin'",
    "platform_machine == 'x86_64' and sys_platform == 'linux'",
]

[tool.uv.sources]
vllm = [
    { git = "https://github.com/vllm-project/vllm.git", tag = "v0.11.0", marker = "sys_platform == 'darwin'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/core"
]

[dependency-groups]
dev = [
    "huggingface-hub[cli]>=0.29.3",
    "ipykernel>=6.29.5",
]
