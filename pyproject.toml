[project]
name = "complexity-aware-fine-tuning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate==1.3.0",
    "datasets>=3.6.0",
    "einops>=0.8.0",
    "ipywidgets>=8.1.7",
    "loguru>=0.7.3",
    "matplotlib>=3.10.1",
    "mistral-common>=1.9.1",
    "mistralai>=1.6.0",
    "numpy>=2.2.4",
    "openai>=1.78.1",
    "pandas>=2.2.3",
    "peft>=0.17.1",
    "protobuf>=6.30.2",
    "pyarrow>=19.0.1",
    "pydraconf>=0.1.0",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.1",
    "torch==2.10.0",
    "tqdm>=4.67.1",
    "transformers==4.52.3",
]

[project.optional-dependencies]
evals = [
    "flash-attn>=2.8.3",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/core"
]

[tool.uv]
no-build-isolation-package = ["flash-attn", "xformers"]

[dependency-groups]
dev = [
    "huggingface-hub[cli]>=0.29.3",
    "ipykernel>=6.29.5",
    "pytest>=9.0.2",
]
